# Render blueprint for the single container (see docs/architecture.md, "Hosting").
# Inert until a service is created from it. Secrets are named here and set in the dashboard
# (sync: false): they are never in this file, in the repository or in the image.
services:
  - type: web
    name: spotter-truck-routing
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Unverified until the first deploy: the app answers 400 to a Host outside DJANGO_ALLOWED_HOSTS.
    healthCheckPath: /api/health
    # Expected to make every deploy a manual act that follows the owner's word, never a side effect
    # of a push. Unverified until the first deploy: that this key and value turn auto-deploy off.
    autoDeployTrigger: "off"
    envVars:
      # Non-secret. Expected to reach the frontend build through the Dockerfile's build argument of
      # the same name, so that a long wait says the server may be waking up (this host sleeps when
      # idle). Unverified until the first deploy: that Render passes service env vars to a Docker
      # build as build arguments.
      - key: VITE_HOST_SLEEPS
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # The service's own hostname, known only after the service exists; set in the dashboard.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
