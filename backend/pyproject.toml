[project]
name = "spotter-truck-routing-api"
version = "0.1.0"
description = "Weather-aware truck route recommendation API"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-ninja>=1.8,<2",
    "uvicorn>=0.54",
    "python-dotenv>=1.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-django>=4.14",
    "respx>=0.23.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
